<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>写経：プロフィールカード</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>メンバー紹介</h1>
    </header>

    <main class="container">
      <section>
        <h2>メンバー</h2>
        <div class="cards">
          <article class="card">
            <img src="avatar.svg" alt="" width="96" height="96" />
            <h3 class="card-name">山田 太郎</h3>
            <p class="card-role">イベント企画</p>
            <ul class="tags">
              <li>HTML</li>
              <li>CSS</li>
            </ul>
          </article>
          <article class="card">
            <img src="avatar.svg" alt="" width="96" height="96" />
            <h3 class="card-name">Emily Brown</h3>
            <p class="card-role">翻訳・通訳</p>
            <ul class="tags">
              <li>English</li>
              <li>日本語</li>
            </ul>
          </article>
          <article class="card">
            <img src="avatar.svg" alt="" width="96" height="96" />
            <h3 class="card-name">李 明</h3>
            <p class="card-role">広報</p>
            <ul class="tags">
              <li>デザイン</li>
              <li>写真</li>
            </ul>
          </article>
        </div>
      </section>

      <section class="contact">
        <h2>お問い合わせ</h2>
        <form class="form">
          <label for="name">名前</label>
          <input id="name" name="name" type="text" required />

          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" required />

          <label for="message">メッセージ</label>
          <textarea id="message" name="message" rows="4"></textarea>

          <button type="submit">送信</button>
        </form>
      </section>
    </main>

    <footer class="page-footer">
      <p><small>&copy; 2026 Connect Project</small></p>
    </footer>
  </body>
</html>
